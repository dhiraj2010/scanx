name: Build ScanX APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (already on the GitHub build machine)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME

      - name: Install packages
        run: npm install --no-audit --no-fund
        timeout-minutes: 5

      - name: Copy app files
        run: npm run prepare-web

      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python3 make_icons.py

      - name: Sync
        run: npx cap sync android

      - name: Use the fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          base64 -d debug.keystore.b64 > ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ScanX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScanX-APK
          path: ScanX.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ScanX v1.0.${{ github.run_number }}
          files: ScanX.apk
          body: Open this page on your Android phone, tap ScanX.apk to download, then install it.
